[project]
name = "qbiz-jira-mcp"
version = "0.1.0"
description = "Jira MCP server for qbiz agents"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jira>=3.10.5",
    # mcp 2.0.0 renamed mcp.server.fastmcp -> mcp.server.mcpserver (FastMCP -> MCPServer),
    # breaking this server's import. Pinned below 2.0.0 until migrated.
    "mcp>=1.28.0,<2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
jira-mcp = "jira_mcp.jira_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_mcp"]
