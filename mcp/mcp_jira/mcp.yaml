name: jira
description: Jira integration for agents. Create tickets, search issues, review details, add comments, and list projects via the Jira API.

command: uvx
args:
  - --from
  - git+https://github.com/Qbizinc/qbiz-agents.git#subdirectory=mcp/mcp_jira
  - jira-mcp

env:
  JIRA_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  JIRA_DEFAULT_PROJECT: "PROJ"

tools:
  - create_jira_ticket
  - search_jira_tickets
  - add_jira_comment
  - review_jira_ticket
  - list_projects