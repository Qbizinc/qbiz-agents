[project]
name = "aws-readonly-mcp"
version = "0.1.0"
description = "Read-only MCP server for AWS S3, Redshift, and IAM (via STS AssumeRole)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "boto3>=1.34.0",
]

[project.scripts]
aws-readonly-mcp = "aws_readonly_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "moto[s3,sts,iam,redshift]>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_readonly_mcp"]
