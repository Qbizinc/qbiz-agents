[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qba-agents"
version = "0.1.0"
description = "CLI for installing and managing Qbiz AI skills and MCP servers"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
qba = "qba.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["qba"]

[tool.ruff]
line-length = 100
