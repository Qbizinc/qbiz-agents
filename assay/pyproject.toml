[project]
name = "qbiz-assay"
version = "0.1.0"
description = "Data & AI readiness assessment agent — scans a client's data estate and produces a scored, harness-governed report."
requires-python = ">=3.11"
dependencies = [
    "qbiz-agent-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbiz_assay"]

[tool.uv.sources]
qbiz-agent-harness = { path = "../harness", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]
